<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#1a1a2e"/>
  <rect x="60" y="60" width="680" height="330" rx="16" fill="#16213e"/>
  <!-- 3x3 퍼즐 격자 -->
  <g transform="translate(272, 80)">
    <!-- Row 0 -->
    <rect x="0"   y="0"   width="72" height="72" rx="8" fill="#4a90e2"/><text x="36"  y="48" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    <rect x="80"  y="0"   width="72" height="72" rx="8" fill="#4a90e2"/><text x="116" y="48" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
    <rect x="160" y="0"   width="72" height="72" rx="8" fill="#4a90e2"/><text x="196" y="48" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
    <!-- Row 1 -->
    <rect x="0"   y="80"  width="72" height="72" rx="8" fill="#4a90e2"/><text x="36"  y="128" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
    <rect x="80"  y="80"  width="72" height="72" rx="8" fill="#4a90e2"/><text x="116" y="128" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
    <rect x="160" y="80"  width="72" height="72" rx="8" fill="#4a90e2"/><text x="196" y="128" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
    <!-- Row 2 -->
    <rect x="0"   y="160" width="72" height="72" rx="8" fill="#4a90e2"/><text x="36"  y="208" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#fff" text-anchor="middle">7</text>
    <rect x="80"  y="160" width="72" height="72" rx="8" fill="#4a90e2"/><text x="116" y="208" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#fff" text-anchor="middle">8</text>
